name: Build and deploy ASP.Net Core app to Azure Web App - intitech-shorturl

on:
  push:
    branches:
      - minimal-api-refactor
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish -c Release -o ./Publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./Publish        # ← THIS was the bug, now fixed

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_40D0FA489B3145869DDE82AA8CFEAD65 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CBBAA53E844B41B29B7416461B213E10 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CE6451B2AA2447959B8068225458D89B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'intitech-shorturl'
          slot-name: 'Production'
          package: .
